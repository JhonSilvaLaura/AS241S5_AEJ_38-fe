apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: jhon-silva-38
  labels:
    app: unified-frontend
    name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unified-frontend
      name: frontend-deployment
  template:
    metadata:
      labels:
        app: unified-frontend
        name: frontend-deployment
    spec:
      containers:
      - name: unified-frontend
        image: jhonbrayansilvalaura/unified-frontend:v4-k8s
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        # Variables desde ConfigMap (URLs de backends)
        - name: VITE_ARTICLE_API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-configmap
              key: VITE_ARTICLE_API_URL
        - name: VITE_CARTOON_API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-configmap
              key: VITE_CARTOON_API_URL
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: frontend-configmap
              key: NODE_ENV
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
