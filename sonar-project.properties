# SonarCloud Configuration for Unified AI Platform Frontend

# Project identification
sonar.projectKey=JhonSilvaLaura_AS241S5_AEJ_38-fe
sonar.organization=jhonsilvalaura

# Project info
sonar.projectName=Unified AI Platform Frontend
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclude files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.config.js,**/*.config.ts,**/coverage/**

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis parameters
sonar.qualitygate.wait=true
